{{ define "main" }}
<article class="page">
  <h2 class="page-title">{{ .Title }}</h2>
  {{- with .Date }}{{ if not $.Date.IsZero }}<p class="meta">{{ $.Date.Format "January 2, 2006" }}</p>{{ end }}{{ end }}
  {{ .Content }}
  <p class="back"><a href="{{ site.Home.RelPermalink }}">&larr; Back to home</a></p>
</article>
{{ end }}
